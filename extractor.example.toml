# extractor.toml — ajuste fino para um alvo específico. Copie para extractor.toml (fica fora do git) e mude só o que
# precisar; o resto usa a detecção automática. Para achar os seletores: abra o alvo no Chrome, F12 → Elements,
# clique com o botão direito no elemento → Copy → Copy selector (prefira ids e classes estáveis a posições).

# browser_channel = "chrome"     # usa o Google Chrome instalado em vez do Chromium do Playwright
# output_dir = "output"

[selectors]
# Container do MENU (barra lateral, árvore, lista de módulos). Vazio = detecção automática.
# nav_container = "aside.course-outline"
# Itens clicáveis dentro do menu (quando são <div>s sem papel acessível, por exemplo).
# nav_item = "a, .outline-item"
# Abrir módulos recolhidos antes de mapear.
# expand_collapsed = true

# Container do CONTEÚDO (pode estar dentro de iframes; o extrator procura em todos). Vazio = o de mais texto.
# content_container = "div.lesson-body"

# Ruído extra a remover do conteúdo (acrescente às classes padrão — copie a lista de config.py e some as suas).
# noise = ["nav", "header", "footer", "button", ".btn-next", ".btn-prev", ".feedback-widget"]
# noise_texts = ["próximo", "anterior", "marcar como concluído"]

# Indicadores de carregamento que o extrator espera sumir.
# loading = ".spinner, .loading, [aria-busy=true]"

[timing]
# Ritmo educado: pausa aleatória entre itens (segundos). Aumente se o alvo for sensível a carga.
# min_delay_s = 1.5
# max_delay_s = 4.0
# Conteúdo "estável" = este tempo sem mudanças no DOM, em todos os frames (ms).
# quiet_ms = 800
# stable_timeout_ms = 20000
# retries = 2
