<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Curso com slides</title>
<style>
  body { margin: 0; font-family: sans-serif; display: grid; grid-template-columns: 260px 1fr; }
  iframe { width: 100%; height: 90vh; border: 0; }
</style></head>
<body>
<nav class="course-outline"><ul>
  <li><button class="module" aria-expanded="true">Módulo 1 — Privacidade</button>
    <ul>
      <li><a href="#" data-lesson="texto">Lição 1 — Conceitos</a></li>
      <li><a href="#" data-lesson="slides">Lição 2 — GDPR em slides</a></li>
    </ul></li>
</ul></nav>
<main id="content"><p>Escolha uma lição.</p></main>
<script>
  // a lição 2 é um player de slides (story.html) num iframe; a 1 é texto comum
  const main = document.getElementById('content')
  for (const a of document.querySelectorAll('[data-lesson]')) {
    a.addEventListener('click', (e) => {
      e.preventDefault()
      main.innerHTML = a.dataset.lesson === 'texto'
        ? '<h1>Conceitos</h1><p>Dados pessoais identificam uma pessoa.</p>'
        : '<iframe src="story.html" title="Lição em slides"></iframe>'
    })
  }
</script>
</body></html>
