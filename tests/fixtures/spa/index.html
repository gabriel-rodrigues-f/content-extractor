<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Academia Exemplo</title>
<style>
  body { margin: 0; font-family: sans-serif; display: grid; grid-template-columns: 260px 1fr; grid-template-rows: 48px 1fr 32px; height: 100vh; }
  header { grid-column: 1 / 3; background: #0f172a; color: #fff; padding: 12px; }
  aside { overflow: auto; border-right: 1px solid #ddd; padding: 8px; }
  main { position: relative; }
  iframe { width: 100%; height: 100%; border: 0; }
  footer { grid-column: 1 / 3; font-size: 12px; padding: 8px; }
  .spinner { position: absolute; inset: 0; background: #fff; }
  [hidden] { display: none !important; }
</style></head>
<body>
<header>Academia Exemplo <button id="logout">Sair</button></header>
<aside class="sidebar">
  <ul>
    <li><button class="module" aria-expanded="false">Módulo 1 — Fundamentos</button>
      <ul hidden>
        <li><a data-lesson="bpm">Lição 1.1 — O que é BPM</a></li>
        <li><a data-lesson="bpmn">Lição 1.2 — Notação BPMN</a></li>
      </ul>
    </li>
    <li><button class="module" aria-expanded="false">Módulo 2 — Simulação</button>
      <ul hidden>
        <li><a data-lesson="montecarlo">Lição 2.1 — Monte Carlo</a></li>
      </ul>
    </li>
  </ul>
</aside>
<main>
  <div class="spinner" hidden>Carregando…</div>
  <iframe id="viewer" src="viewer.html" title="Conteúdo"></iframe>
</main>
<footer>© 2026 Academia Exemplo · Termos de uso</footer>
<script>
  // SPA: a URL nunca muda; o conteúdo chega por mensagem ao iframe (que tem outro iframe dentro)
  for (const b of document.querySelectorAll('.module')) {
    b.addEventListener('click', () => {
      const open = b.getAttribute('aria-expanded') === 'true'
      b.setAttribute('aria-expanded', String(!open))
      b.nextElementSibling.hidden = open
    })
  }
  const spinner = document.querySelector('.spinner')
  for (const a of document.querySelectorAll('[data-lesson]')) {
    a.addEventListener('click', (e) => {
      e.preventDefault()
      spinner.hidden = false
      setTimeout(() => {
        document.getElementById('viewer').contentWindow.postMessage({ lesson: a.dataset.lesson }, '*')
        setTimeout(() => { spinner.hidden = true }, 250)
      }, 400)
    })
  }
</script>
</body></html>
